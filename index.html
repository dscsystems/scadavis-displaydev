<!doctype html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADAvis.io | Display Developer</title>
    <link rel="stylesheet" href="jexcel.css" type="text/css" />
    <link rel="stylesheet" href="jsuites.css" type="text/css" />
    <link rel="stylesheet" href="index.css" type="text/css" />
    <script src="jexcel.js"></script>
    <script src="jsuites.js"></script>
    <script src="jszip.js"></script>
    <script src="xlsx.js"></script>
  </head>

  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-controls">
          <section class="section">
            <h2 class="section-title">Data Source</h2>
            <div class="input-group">
              <label for="sheetname">Tags File</label>
              <input type="text" id="sheetname" class="input-control" value="taglist.csv" />
            </div>
            <button class="btn" onClick="setup_taglist();">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
              Reload Tags
            </button>
          </section>

          <section class="section">
            <h2 class="section-title">Display Settings</h2>
            <div class="input-group">
              <label for="svgname">SVG Display File</label>
              <input type="text" id="svgname" class="input-control" value="training1.svg" />
            </div>
            <div id="svgerr"></div>
            <button class="btn" onClick="setup_display();">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              Reload Display
            </button>
          </section>

          <section class="section">
            <h2 class="section-title">Dimensions &amp; View</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div class="input-group">
                <label for="svgwidth">Width</label>
                <input type="number" id="svgwidth" class="input-control" value="800" />
              </div>
              <div class="input-group">
                <label for="svgheight">Height</label>
                <input type="number" id="svgheight" class="input-control" value="600" />
              </div>
            </div>
            <div class="input-group">
              <label for="svgzoom">Zoom Level</label>
              <input type="number" id="svgzoom" class="input-control" step="0.1" value="0.5" />
            </div>
          </section>
        </div>

        <div class="data-panel">
          <div class="data-panel-header">
            <div class="data-panel-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
              Data Points
            </div>
            <button class="btn-add-point" onClick="window.sheet.insertRow();" title="Add new row">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
          <div class="spreadsheet-wrapper">
            <div id="spreadsheet"></div>
          </div>
        </div>

        <div class="status-info">
          <p>SCADAvis.io &bull; DSC Systems &copy; 2020-present</p>
        </div>
      </aside>

      <main class="main-content">
        <div id="divdisplay"></div>
      </main>
    </div>

    <script type="module">
      import { scadavisInit } from "./synoptic3/scada-vis.js";

      window.sheet = null;
      let svgstring;
      let svInstance;

      let changed = function (instance, cell, x, y, value) {
        if (window.sheet == undefined || window.sheet == null || svInstance == undefined)
          return;

        let dt = window.sheet.getData();

        for (let i = 0; i < dt.length; i++) {
          let tag = dt[i][0];
          let val = dt[i][1];
          if (!tag) continue;

          if (!isNaN(parseFloat(val)))
            svInstance.storeValue(tag, parseFloat(val), false, false);
          else if (val.toLowerCase() === "false")
            svInstance.storeValue(tag, false, false, false);
          else if (val.toLowerCase() === "true")
            svInstance.storeValue(tag, true, false, false);
          else 
            svInstance.storeValue(tag, val, false, false);
        }
        svInstance.updateValues();
      };

      function setup_taglist() {
        if (window.sheet) {
          jexcel.destroy(document.getElementById("spreadsheet"));
        }
        window.sheet = null;

        const sheetUrl = document.getElementById("sheetname").value;
        const isXlsx = sheetUrl.toLowerCase().endsWith(".xlsx");

        if (isXlsx) {
          jexcel.fromSpreadsheet(
            sheetUrl + "?R=" + Math.random(),
            function (result) {
              if (!result.length) {
                console.error("JEXCEL: Something went wrong.");
              } else {
                result[0].onchange = changed;
                result[0].columns = [{ title: "TAG", width: 120 }, { title: "Value", width: 90 }];
                window.sheet = jexcel(document.getElementById("spreadsheet"), result[0]);
                changed();
              }
            },
          );
        } else {
          window.sheet = jexcel(document.getElementById("spreadsheet"), {
            csv: sheetUrl + "?R=" + Math.random(),
            csvHeaders: true,
            columns: [
              { type: "text", title: "TAG",   width: 120 },
              { type: "text", title: "Value", width: 90  },
            ],
            onchange: changed,
            onload: function () {
              changed();
            },
          });
        }
      }

      // Cache for Blob URLs to avoid memory leaks
      let activeBlobUrl = null;

      async function getFetchUrl(url) {
        if (!url) return null;

        // 1. URL Normalization
        let targetUrl = url.split('#')[0].trim(); 
        if (targetUrl.includes("github.com") && targetUrl.includes("/raw/")) {
            targetUrl = targetUrl.replace("github.com", "raw.githubusercontent.com").replace("/raw/", "/");
        }
        
        // Helpful tip for Wikimedia users
        if (targetUrl.includes("wikimedia.org/wiki/")) {
            document.getElementById("svgerr").textContent = "Tip: Use 'Original File' link from Wikimedia";
        }

        const cacheBust = (targetUrl.includes('?') ? '&' : '?') + "R=" + Math.random();
        const fullUrl = targetUrl + cacheBust;
        
        try {
            const urlObj = new URL(targetUrl, window.location.href);
            if (urlObj.origin === window.location.origin) return fullUrl;

            // 2. Try DIRECT fetch first (best for CORS-enabled sites)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500);
            try {
                const check = await fetch(fullUrl, { method: 'HEAD', signal: controller.signal });
                clearTimeout(timeoutId);
                if (check.ok) return fullUrl;
            } catch (e) {
                clearTimeout(timeoutId);
            }
        } catch (e) {
            return fullUrl;
        }

        // 3. Proxy Failover Chain
        const proxyStrategies = [
            (u) => "https://api.allorigins.win/get?url=" + encodeURIComponent(u),
            (u) => "https://corsproxy.io/?" + encodeURIComponent(u)
        ];

        for (let getProxy of proxyStrategies) {
            try {
                const proxyUrl = getProxy(fullUrl);
                const response = await fetch(proxyUrl);
                if (!response.ok) continue;

                let contents = "";
                if (proxyUrl.includes("allorigins")) {
                    const data = await response.json();
                    contents = data.contents;
                } else {
                    contents = await response.text();
                }

                if (contents && contents.length > 50) {
                    if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
                    const blob = new Blob([contents], { type: 'image/svg+xml' });
                    activeBlobUrl = URL.createObjectURL(blob);
                    return activeBlobUrl;
                }
            } catch (e) {
                console.warn("Proxy attempt failed, trying fallback...");
            }
        }
        
        return fullUrl; // Final fallback to direct (likely to fail but last resort)
      }

      async function setup_display() {
        const width = document.getElementById("svgwidth").value;
        const height = document.getElementById("svgheight").value;
        const svgUrl = document.getElementById("svgname").value;
        const zoom = document.getElementById("svgzoom").value;

        const displayContainer = document.getElementById("divdisplay");
        if (!displayContainer) return;
        
        displayContainer.innerHTML = "";
        const status = document.getElementById("svgerr");
        status.textContent = "Resolving URL...";
        
        const fetchUrl = await getFetchUrl(svgUrl);
        if (!fetchUrl) return;
        
        status.textContent = "Loading SVG...";
        scadavisInit({
          container: "divdisplay",
          iframeparams: `height="${height}" width="${width}"`,
          svgurl: fetchUrl,
        }).then(function (sv) {
          if (!sv) throw new Error("Empty instance");
          svInstance = sv;
          svInstance.zoomTo(zoom);
          svInstance.enableTools(false, true);
          svInstance.hideWatermark();
          status.textContent = "";
          changed();
        }).catch(e => {
            console.error("Init Error:", e);
            status.textContent = "Error: Check URL or CORS settings";
        });
      }

      // Expose functions to global scope
      window.setup_taglist = setup_taglist;
      window.setup_display = setup_display;
      window.changed = changed;

      // Initial Load
      document.addEventListener("DOMContentLoaded", () => {
        setup_taglist();
        setup_display();
      });

      // File Watcher Simulation
      setInterval(async function () {
        const inputUrl = document.getElementById("svgname").value;
        if (!inputUrl) return;

        try {
            const fetchUrl = await getFetchUrl(inputUrl);
            const r = await fetch(fetchUrl);
            const text = await r.text();
            if (text && text.length > 50 && text != svgstring) {
                svgstring = text;
                document.getElementById("svgerr").textContent = "Updating...";
                setup_display();
            }
        } catch (e) {
            // Silently wait
        }
      }, 5000);
    </script>
  </body>
</html>
